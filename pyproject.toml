[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nps-analyst"
version = "0.1.0"
description = "Multi-agent NPS analysis system using AWS Strands"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["nps_insights_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring live LLM or external APIs"
]